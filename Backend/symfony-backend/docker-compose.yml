version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: minijira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minijira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password_minijira
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - minijira-network

  symfony_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minijira_symfony
    restart: unless-stopped
    depends_on:
      - database
    environment:
      APP_ENV: prod
      APP_SECRET: a8f43b6791e847c210d3e5812903ab76
      DATABASE_URL: "postgresql://postgres:secret_password_minijira@database:5432/minijira?serverVersion=16&charset=utf8"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: "minijira_jwt_passphrase_secure_2025"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
    networks:
      - minijira-network

  web:
    image: nginx:alpine
    container_name: minijira_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/symfony:ro
    depends_on:
      - symfony_app
    networks:
      - minijira-network

  adminer:
    image: adminer:latest
    container_name: minijira_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - minijira-network

networks:
  minijira-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
